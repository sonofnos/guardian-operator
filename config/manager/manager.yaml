apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardian-operator-controller-manager
  namespace: guardian-operator-system
  labels:
    app.kubernetes.io/name: guardian-operator
spec:
  # Two replicas exercise the HA path for real: only the leader (holder of
  # the guardian-operator-leader.sonofnos.dev Lease) reconciles at a time.
  # Kill the leader pod and the standby takes over within roughly one
  # LeaseDuration (controller-runtime default: 15s).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: guardian-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guardian-operator
    spec:
      serviceAccountName: guardian-operator-controller-manager
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: guardian-operator:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: AWS_ENDPOINT_URL
              value: ""
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
